
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 08 - Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HTML Sign-up Form</h1>
        <p>HTML and CSS Development Lab - Lab 08</p>
    </header>

    <main class="container">

        <!-- Task 1: Create a Basic Registration Form -->
        <section class="card">
            <h2>Task 1: Basic Registration Form</h2>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                    >
                </div>

                <!-- Task 2: Radio Buttons and Checkboxes -->
                <h3>Task 2: Select Your Choices</h3>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="choice">
                        <label>
                            <input type="radio" name="gender" value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="other">
                            Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Interested Technologies</label>

                    <div class="choice">
                        <label>
                            <input type="checkbox" name="technology" value="html">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="technology" value="css">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="technology" value="javascript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="technology" value="python">
                            Python
                        </label>
                    </div>
                </div>

                <!-- Task 3: Dropdown and Textarea -->
                <h3>Task 3: Additional Information</h3>

                <div class="form-group">
                    <label for="course">Select Course</label>

                    <select id="course" name="course">
                        <option value="">-- Select Course --</option>
                        <option value="btech">B.Tech</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                        <option value="diploma">Diploma</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">About Yourself</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Write something about yourself..."
                    ></textarea>
                </div>

                <div class="buttons">
                    <button type="submit">Sign Up</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
